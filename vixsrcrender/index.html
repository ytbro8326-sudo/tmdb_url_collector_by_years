<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStreamX — Stream HD Movies Free</title>
    <meta name="description" content="Watch high-definition movies online for free with multi-server streaming and instant TMDB discovery.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07070d;
            --bg2: #0d0d18;
            --bg3: #131322;
            --bg4: #1c1c30;
            --border: #1e1e35;
            --border2: #2d2d4d;
            --accent: #e50914;
            --accent-hover: #b80710;
            --accent2: #6366f1;
            --gold: #fbbf24;
            --cyan: #06b6d4;
            --text: #f1f1f7;
            --text2: #9ba1b8;
            --text3: #60667e;
            --card-r: 12px;
            --trans: .2s cubic-bezier(.4, 0, .2, 1);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        #root {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ── VIEWS ── */
        #view-home,
        #view-player {
            position: absolute;
            inset: 0;
            transition: opacity .35s ease, transform .35s ease;
        }

        #view-home {
            z-index: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #view-player {
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transform: translateY(24px);
            display: flex;
            flex-direction: column;
        }

        #view-player.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        #view-home.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent2);
        }

        /* ══════════ NAVBAR ══════════ */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 28px;
            height: 64px;
            background: rgba(7, 7, 13, .92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
            flex-shrink: 0;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -.03em;
            background: linear-gradient(135deg, #ff4b4b 0%, #f97316 50%, #e50914 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo span {
            color: #fff;
            -webkit-text-fill-color: #fff;
            font-size: 11px;
            padding: 2px 7px;
            background: var(--accent);
            border-radius: 6px;
            font-weight: 900;
            letter-spacing: .05em;
        }

        /* Search */
        #search-wrap {
            flex: 1;
            max-width: 480px;
            position: relative;
        }

        #search-inp {
            width: 100%;
            padding: 10px 16px 10px 42px;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 24px;
            color: var(--text);
            font-size: 13.5px;
            outline: none;
            transition: all var(--trans);
        }

        #search-inp::placeholder {
            color: var(--text3);
        }

        #search-inp:focus {
            border-color: var(--accent);
            background: var(--bg4);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, .2);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text3);
            pointer-events: none;
        }

        /* Search dropdown */
        #search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .8);
            z-index: 200;
            display: none;
            max-height: 480px;
            overflow-y: auto;
        }

        #search-dropdown.show {
            display: block;
        }

        .sd-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background var(--trans);
            border-bottom: 1px solid var(--border);
        }

        .sd-item:last-child {
            border-bottom: none;
        }

        .sd-item:hover {
            background: var(--bg4);
        }

        .sd-img {
            width: 40px;
            height: 56px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: var(--bg4);
        }

        .sd-info {
            flex: 1;
            min-width: 0;
        }

        .sd-title {
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        .sd-meta {
            font-size: 11px;
            color: var(--text2);
            margin-top: 3px;
            display: flex;
            gap: 8px;
        }

        .sd-score {
            font-size: 11px;
            color: var(--gold);
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--text2);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--trans);
            white-space: nowrap;
        }

        .nav-btn:hover,
        .nav-btn.active {
            border-color: var(--accent);
            background: rgba(229, 9, 20, .12);
            color: #fff;
        }

        /* ══════════ HERO SECTION ══════════ */
        #hero {
            position: relative;
            overflow: hidden;
            min-height: 480px;
            display: flex;
            align-items: flex-end;
            padding: 0 36px 48px;
            background: linear-gradient(135deg, #101020 0%, #0d0710 50%, #07070d 100%);
        }

        #hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center 20%;
            opacity: 0;
            transition: opacity 1s ease;
            filter: blur(0px) brightness(0.85);
        }

        #hero-bg.loaded {
            opacity: 0.38;
        }

        #hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg) 0%, rgba(7, 7, 13, .75) 45%, rgba(7, 7, 13, .3) 100%),
                linear-gradient(to right, var(--bg) 0%, rgba(7, 7, 13, .8) 40%, transparent 100%);
        }

        #hero-content {
            position: relative;
            z-index: 2;
            max-width: 620px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(229, 9, 20, .2);
            border: 1px solid rgba(229, 9, 20, .4);
            font-size: 11px;
            font-weight: 800;
            color: #ff6b6b;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        #hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(24px, 4.5vw, 42px);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 10px;
            letter-spacing: -.02em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, .8);
        }

        #hero-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .hero-tag {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            background: var(--bg4);
            color: var(--text2);
            border: 1px solid var(--border2);
        }

        .hero-score {
            color: var(--gold);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hero-year {
            color: var(--text2);
            font-size: 12.5px;
            font-weight: 600;
        }

        #hero-desc {
            font-size: 14px;
            color: #c4c8dc;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 22px;
            max-width: 540px;
        }

        #hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--trans);
        }

        .hero-btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 25px rgba(229, 9, 20, .35);
        }

        .hero-btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(229, 9, 20, .5);
        }

        .hero-btn-secondary {
            background: rgba(255, 255, 255, .1);
            color: var(--text);
            border: 1px solid var(--border2);
            backdrop-filter: blur(8px);
        }

        .hero-btn-secondary:hover {
            background: rgba(255, 255, 255, .16);
            transform: translateY(-2px);
        }

        /* ══════════ GENRE & FILTER BAR ══════════ */
        #genre-bar {
            display: flex;
            gap: 8px;
            padding: 20px 28px;
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
        }

        #genre-bar::-webkit-scrollbar {
            display: none;
        }

        .genre-pill {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid var(--border2);
            background: var(--bg3);
            color: var(--text2);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--trans);
            flex-shrink: 0;
        }

        .genre-pill:hover,
        .genre-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(229, 9, 20, .3);
        }

        /* ══════════ MOVIE GRIDS & CAROUSELS ══════════ */
        .section {
            padding: 32px 28px 8px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .see-all {
            font-size: 12.5px;
            color: var(--accent2);
            font-weight: 600;
            cursor: pointer;
            transition: color var(--trans);
        }

        .see-all:hover {
            color: #fff;
        }

        .h-scroll-wrap {
            overflow-x: auto;
            padding: 0 28px 24px;
            scrollbar-width: none;
        }

        .h-scroll-wrap::-webkit-scrollbar {
            display: none;
        }

        .h-scroll {
            display: flex;
            gap: 16px;
        }

        .h-scroll .movie-card {
            flex-shrink: 0;
            width: 155px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 18px;
        }

        .movie-card {
            cursor: pointer;
            transition: transform var(--trans);
            border-radius: var(--card-r);
            overflow: hidden;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-6px);
        }

        .card-poster {
            position: relative;
            padding-top: 150%;
            background: var(--bg3);
            overflow: hidden;
            border-radius: var(--card-r);
        }

        .card-poster img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .4s ease;
        }

        .movie-card:hover .card-poster img {
            transform: scale(1.08);
        }

        .card-score {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(6px);
            color: var(--gold);
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-quality {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(229, 9, 20, .9);
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            padding: 3px 6px;
            border-radius: 5px;
            letter-spacing: .05em;
        }

        .card-year {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(6px);
            color: var(--text2);
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(7, 7, 13, .95) 0%, rgba(7, 7, 13, .3) 60%, transparent 100%);
            opacity: 0;
            transition: opacity .25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-card:hover .card-overlay {
            opacity: 1;
        }

        .play-btn-circle {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(229, 9, 20, .6);
            transform: scale(.8);
            transition: transform .25s ease;
        }

        .movie-card:hover .play-btn-circle {
            transform: scale(1);
        }

        .card-info {
            padding: 10px 4px 4px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }

        .card-sub {
            font-size: 11px;
            color: var(--text2);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* ══════════ PLAYER VIEW ══════════ */
        #player-topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            height: 60px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        #back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border2);
            background: var(--bg3);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--trans);
            white-space: nowrap;
            flex-shrink: 0;
        }

        #back-btn:hover {
            border-color: var(--accent);
            background: var(--bg4);
            color: var(--accent);
        }

        #player-movie-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        #player-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        #player-meta-badge {
            font-size: 11.5px;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--bg4);
            color: var(--text2);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Server selector */
        #server-selector-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .server-label {
            font-size: 11px;
            color: var(--text3);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        #server-select {
            padding: 8px 14px;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 10px;
            color: var(--text);
            font-size: 12.5px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border-color var(--trans);
        }

        #server-select:focus {
            border-color: var(--accent);
        }

        #player-main {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #player-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Details & Recommendations below player */
        #player-details-row {
            padding: 24px 28px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            max-height: 280px;
            overflow-y: auto;
        }

        .player-info-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .player-info-overview {
            font-size: 13.5px;
            color: var(--text2);
            line-height: 1.6;
            margin-bottom: 16px;
            max-width: 900px;
        }

        /* Loading Spinner */
        .loading-spin {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ══════════ RESPONSIVE ══════════ */
        @media (max-width: 768px) {
            #navbar {
                padding: 0 16px;
                height: 58px;
                gap: 10px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-btn {
                padding: 6px 12px;
                font-size: 11px;
            }

            #hero {
                padding: 0 18px 32px;
                min-height: 380px;
            }

            #hero-title {
                font-size: 24px;
            }

            #hero-desc {
                font-size: 12.5px;
            }

            .section {
                padding: 24px 16px 4px;
            }

            .h-scroll-wrap {
                padding: 0 16px 20px;
            }

            #genre-bar {
                padding: 14px 16px;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
                gap: 12px;
            }

            .h-scroll .movie-card {
                width: 130px;
            }

            #player-topbar {
                padding: 0 12px;
                height: 52px;
            }

            #player-title {
                font-size: 13px;
            }

            #server-select {
                font-size: 11px;
                padding: 6px 10px;
            }
        }
    </style>
</head>

<body>
    <div id="root">

        <!-- ══════════ HOME VIEW ══════════ -->
        <div id="view-home">
            <!-- Navbar -->
            <nav id="navbar">
                <div class="logo" onclick="goHome()">Cine<span>STREAM</span></div>
                <div id="search-wrap">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <input id="search-inp" type="text" placeholder="Search movies by title, actor, or genre…" autocomplete="off">
                    <div id="search-dropdown"></div>
                </div>
                <div class="nav-links">
                    <button class="nav-btn active" onclick="loadSection('popular', this)">Popular</button>
                    <button class="nav-btn" onclick="loadSection('top_rated', this)">Top Rated</button>
                    <button class="nav-btn" onclick="loadSection('now_playing', this)">In Theatres</button>
                    <button class="nav-btn" onclick="loadSection('bollywood', this)">Bollywood</button>
                </div>
            </nav>

            <!-- Hero Banner -->
            <section id="hero">
                <div id="hero-bg"></div>
                <div id="hero-overlay"></div>
                <div id="hero-content">
                    <div class="hero-badge">✦ Featured Movie</div>
                    <div id="hero-title">Loading Featured Movie…</div>
                    <div id="hero-meta" class="hero-meta"></div>
                    <div id="hero-desc"></div>
                    <div id="hero-actions">
                        <button class="hero-btn hero-btn-primary" id="hero-play-btn" onclick="heroPlay()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            Watch Movie Now
                        </button>
                        <button class="hero-btn hero-btn-secondary" id="hero-info-btn">Details & Info</button>
                    </div>
                </div>
            </section>

            <!-- Genre bar -->
            <div id="genre-bar">
                <button class="genre-pill active" onclick="filterGenre(null, this)">All Genres</button>
                <button class="genre-pill" onclick="filterGenre(28, this)">Action</button>
                <button class="genre-pill" onclick="filterGenre(12, this)">Adventure</button>
                <button class="genre-pill" onclick="filterGenre(16, this)">Animation</button>
                <button class="genre-pill" onclick="filterGenre(35, this)">Comedy</button>
                <button class="genre-pill" onclick="filterGenre(80, this)">Crime</button>
                <button class="genre-pill" onclick="filterGenre(18, this)">Drama</button>
                <button class="genre-pill" onclick="filterGenre(14, this)">Fantasy</button>
                <button class="genre-pill" onclick="filterGenre(27, this)">Horror</button>
                <button class="genre-pill" onclick="filterGenre(9648, this)">Mystery</button>
                <button class="genre-pill" onclick="filterGenre(10749, this)">Romance</button>
                <button class="genre-pill" onclick="filterGenre(878, this)">Sci-Fi</button>
                <button class="genre-pill" onclick="filterGenre(53, this)">Thriller</button>
            </div>

            <!-- Trending / Now Playing Row -->
            <section class="section">
                <div class="section-header">
                    <div class="section-title"><span class="dot"></span> In Theatres & Trending</div>
                    <span class="see-all" onclick="loadSection('now_playing')">Explore more →</span>
                </div>
            </section>
            <div class="h-scroll-wrap">
                <div class="h-scroll" id="trending-row"></div>
            </div>

            <!-- Top Rated Movies Row -->
            <section class="section">
                <div class="section-header">
                    <div class="section-title"><span class="dot" style="background:var(--gold)"></span> Highest Rated Movies</div>
                    <span class="see-all" onclick="loadSection('top_rated')">Explore more →</span>
                </div>
            </section>
            <div class="h-scroll-wrap">
                <div class="h-scroll" id="top-row"></div>
            </div>

            <!-- Bollywood & Indian Hits Row -->
            <section class="section">
                <div class="section-header">
                    <div class="section-title"><span class="dot" style="background:var(--cyan)"></span> Bollywood & Indian Cinema</div>
                    <span class="see-all" onclick="loadSection('bollywood')">Explore more →</span>
                </div>
            </section>
            <div class="h-scroll-wrap">
                <div class="h-scroll" id="bollywood-row"></div>
            </div>

            <!-- Popular Movies Grid -->
            <section class="section">
                <div class="section-header">
                    <div class="section-title" id="grid-header-title"><span class="dot" style="background:var(--accent2)"></span> Popular Movies</div>
                    <span class="see-all" onclick="loadSection('popular')">Refresh →</span>
                </div>
                <div class="movie-grid" id="popular-grid"></div>
            </section>

            <div style="height:60px"></div>
        </div><!-- /view-home -->


        <!-- ══════════ MOVIE PLAYER VIEW ══════════ -->
        <div id="view-player">
            <!-- Player Top Bar -->
            <div id="player-topbar">
                <button id="back-btn" onclick="closePlayer()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Back to Movies
                </button>
                <div id="player-movie-info">
                    <div id="player-title">Movie Title</div>
                    <div id="player-meta-badge">2025 • HD</div>
                </div>
                <div id="server-selector-wrap">
                    <span class="server-label">Server:</span>
                    <select id="server-select" onchange="changeServer(this.value)">
                        <option value="primesrc">PrimeSrc (Fast HD)</option>
                        <option value="vidsrc_to">VidSrc.to</option>
                        <option value="vidsrc_icu">VidSrc.icu</option>
                        <option value="autoembed">AutoEmbed</option>
                        <option value="smashy">SmashyStream</option>
                        <option value="moviesapi">MoviesAPI</option>
                    </select>
                </div>
            </div>

            <!-- Player Video Frame -->
            <div id="player-main">
                <iframe id="player-frame" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"
                    sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-pointer-lock"></iframe>
            </div>

            <!-- Details below player -->
            <div id="player-details-row">
                <div class="player-info-title" id="p-info-title">Movie Details</div>
                <div class="player-info-overview" id="p-info-overview">Loading overview…</div>
                <div class="section-title" style="font-size:15px; margin-bottom:12px;"><span class="dot"></span> Similar Movies</div>
                <div class="h-scroll-wrap" style="padding:0 0 10px;">
                    <div class="h-scroll" id="player-similar-row"></div>
                </div>
            </div>
        </div><!-- /view-player -->

    </div><!-- /root -->

    <script>
        // ═══════════════════════════════════════════════════════════
        //  TMDB API & CONFIGURATION
        // ═══════════════════════════════════════════════════════════
        const TMDB_KEY = "6fad3f86b8452ee232deb7977d7dcf58";
        const TMDB_BASE = "https://api.themoviedb.org/3";
        const TMDB_IMG_ORIGINAL = "https://image.tmdb.org/t/p/original";
        const TMDB_IMG_W500 = "https://image.tmdb.org/t/p/w500";
        const TMDB_IMG_W342 = "https://image.tmdb.org/t/p/w342";

        let currentMovie = null;
        let currentServer = "primesrc";
        let activeGenre = null;

        // Server URL Providers for direct TMDB ID movie streaming
        const SERVER_PROVIDERS = {
            primesrc: (id) => `https://primesrc.me/embed/movie?tmdb=${id}`,
            vidsrc_to: (id) => `https://vidsrc.to/embed/movie/${id}`,
            vidsrc_icu: (id) => `https://vidsrc.icu/embed/movie/${id}`,
            autoembed: (id) => `https://player.autoembed.cc/embed/movie/${id}`,
            smashy: (id) => `https://player.smashystream.com/movie/${id}`,
            moviesapi: (id) => `https://moviesapi.club/movie/${id}`
        };

        // ═══════════════════════════════════════════════════════════
        //  TMDB API REQUEST HELPER
        // ═══════════════════════════════════════════════════════════
        async function fetchTMDB(endpoint, params = {}) {
            const queryParams = new URLSearchParams({
                api_key: TMDB_KEY,
                language: 'en-US',
                ...params
            });
            try {
                const res = await fetch(`${TMDB_BASE}${endpoint}?${queryParams.toString()}`);
                if (!res.ok) throw new Error(`TMDB error HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error("TMDB Fetch Error:", err);
                return null;
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  HOME PAGE INITIALIZATION
        // ═══════════════════════════════════════════════════════════
        async function initHome() {
            // Load Hero Featured Movie
            loadFeaturedHero();

            // Load Trending & In Theatres
            loadHorizontalList('/movie/now_playing', {}, 'trending-row');

            // Load Top Rated
            loadHorizontalList('/movie/top_rated', {}, 'top-row');

            // Load Bollywood & Indian Cinema
            loadHorizontalList('/discover/movie', {
                with_origin_country: 'IN',
                with_original_language: 'hi|te|ta|ml|kn|bn|pa|mr',
                sort_by: 'popularity.desc'
            }, 'bollywood-row');

            // Load Popular Grid
            loadMovieGrid('/movie/popular', {});

            // Setup Search
            setupSearch();
        }

        // ── Hero Banner ──
        async function loadFeaturedHero() {
            const data = await fetchTMDB('/trending/movie/day');
            if (!data || !data.results || data.results.length === 0) return;

            const movie = data.results[0];
            currentMovie = movie;

            const bgEl = document.getElementById('hero-bg');
            if (movie.backdrop_path) {
                const img = new Image();
                img.src = `${TMDB_IMG_ORIGINAL}${movie.backdrop_path}`;
                img.onload = () => {
                    bgEl.style.backgroundImage = `url(${img.src})`;
                    bgEl.classList.add('loaded');
                };
            }

            document.getElementById('hero-title').textContent = movie.title || movie.original_title;
            document.getElementById('hero-desc').textContent = movie.overview || "Stream this blockbluster movie now in high definition.";

            const year = (movie.release_date || '').split('-')[0] || '2025';
            const score = (movie.vote_average || 0).toFixed(1);

            document.getElementById('hero-meta').innerHTML = `
                <span class="hero-score">★ ${score}</span>
                <span class="hero-year">${year}</span>
                <span class="hero-tag">HD 1080p</span>
                <span class="hero-tag">Multi-Server</span>
            `;

            document.getElementById('hero-info-btn').onclick = () => playMovie(movie.id);
        }

        function heroPlay() {
            if (currentMovie) playMovie(currentMovie.id);
        }

        // ── Horizontal Movie Carousel ──
        async function loadHorizontalList(endpoint, params, elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = `<div style="padding:20px; color:var(--text3);"><div class="loading-spin"></div></div>`;

            const data = await fetchTMDB(endpoint, params);
            if (!data || !data.results) {
                container.innerHTML = `<div style="color:var(--text3); padding:10px;">Failed to load movies.</div>`;
                return;
            }

            container.innerHTML = data.results.slice(0, 15).map(m => createMovieCardHTML(m)).join('');
        }

        // ── Main Movie Grid ──
        async function loadMovieGrid(endpoint, params) {
            const grid = document.getElementById('popular-grid');
            grid.innerHTML = `<div style="padding:20px; color:var(--text3);"><div class="loading-spin"></div></div>`;

            const data = await fetchTMDB(endpoint, params);
            if (!data || !data.results) {
                grid.innerHTML = `<div style="color:var(--text3); padding:10px;">No movies found.</div>`;
                return;
            }

            grid.innerHTML = data.results.map(m => createMovieCardHTML(m)).join('');
        }

        // ── Movie Card HTML ──
        function createMovieCardHTML(movie) {
            const poster = movie.poster_path ? `${TMDB_IMG_W342}${movie.poster_path}` : 'https://via.placeholder.com/342x513?text=No+Poster';
            const year = (movie.release_date || '').split('-')[0] || '';
            const score = movie.vote_average ? movie.vote_average.toFixed(1) : 'NR';
            const title = (movie.title || movie.original_title || '').replace(/'/g, "\\'");

            return `
                <div class="movie-card" onclick="playMovie(${movie.id})">
                    <div class="card-poster">
                        <img src="${poster}" alt="${title}" loading="lazy">
                        <div class="card-score">★ ${score}</div>
                        <div class="card-quality">HD</div>
                        <div class="card-year">${year}</div>
                        <div class="card-overlay">
                            <div class="play-btn-circle">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${movie.title || movie.original_title}</div>
                        <div class="card-sub">
                            <span>Movie</span>
                            <span>${year}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ── Section Tabs ──
        function loadSection(section, btn) {
            if (btn) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            const headerTitle = document.getElementById('grid-header-title');

            if (section === 'popular') {
                headerTitle.innerHTML = `<span class="dot" style="background:var(--accent2)"></span> Popular Movies`;
                loadMovieGrid('/movie/popular', {});
            } else if (section === 'top_rated') {
                headerTitle.innerHTML = `<span class="dot" style="background:var(--gold)"></span> Highest Rated Movies`;
                loadMovieGrid('/movie/top_rated', {});
            } else if (section === 'now_playing') {
                headerTitle.innerHTML = `<span class="dot" style="background:var(--accent)"></span> Now In Theatres`;
                loadMovieGrid('/movie/now_playing', {});
            } else if (section === 'bollywood') {
                headerTitle.innerHTML = `<span class="dot" style="background:var(--cyan)"></span> Bollywood & Indian Cinema`;
                loadMovieGrid('/discover/movie', {
                    with_origin_country: 'IN',
                    with_original_language: 'hi|te|ta|ml|kn|bn|pa|mr',
                    sort_by: 'popularity.desc'
                });
            }

            // Scroll to grid
            document.getElementById('popular-grid').scrollIntoView({ behavior: 'smooth' });
        }

        // ── Genre Filter ──
        function filterGenre(genreId, btn) {
            document.querySelectorAll('.genre-pill').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            activeGenre = genreId;
            const headerTitle = document.getElementById('grid-header-title');

            if (!genreId) {
                headerTitle.innerHTML = `<span class="dot" style="background:var(--accent2)"></span> All Movies`;
                loadMovieGrid('/movie/popular', {});
            } else {
                headerTitle.innerHTML = `<span class="dot" style="background:var(--accent)"></span> ${btn ? btn.textContent : 'Genre'} Movies`;
                loadMovieGrid('/discover/movie', { with_genres: genreId, sort_by: 'popularity.desc' });
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  SEARCH
        // ═══════════════════════════════════════════════════════════
        function setupSearch() {
            const input = document.getElementById('search-inp');
            const dropdown = document.getElementById('search-dropdown');
            let debounceTimer = null;

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                const query = input.value.trim();

                if (!query) {
                    dropdown.classList.remove('show');
                    dropdown.innerHTML = '';
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    const data = await fetchTMDB('/search/movie', { query });
                    if (!data || !data.results || data.results.length === 0) {
                        dropdown.innerHTML = `<div style="padding:14px; color:var(--text3); font-size:13px;">No movies found for "${query}"</div>`;
                        dropdown.classList.add('show');
                        return;
                    }

                    dropdown.innerHTML = data.results.slice(0, 8).map(m => {
                        const poster = m.poster_path ? `${TMDB_IMG_W342}${m.poster_path}` : 'https://via.placeholder.com/342x513?text=No+Poster';
                        const year = (m.release_date || '').split('-')[0] || 'N/A';
                        const score = m.vote_average ? m.vote_average.toFixed(1) : 'NR';
                        return `
                            <div class="sd-item" onclick="playMovie(${m.id}); document.getElementById('search-dropdown').classList.remove('show');">
                                <img class="sd-img" src="${poster}" alt="${m.title}">
                                <div class="sd-info">
                                    <div class="sd-title">${m.title}</div>
                                    <div class="sd-meta">
                                        <span>${year}</span>
                                        <span class="sd-score">★ ${score}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    dropdown.classList.add('show');
                }, 300);
            });

            document.addEventListener('click', (e) => {
                if (!document.getElementById('search-wrap').contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });
        }

        // ═══════════════════════════════════════════════════════════
        //  MOVIE STREAMING PLAYER
        // ═══════════════════════════════════════════════════════════
        async function playMovie(tmdbId) {
            const movie = await fetchTMDB(`/movie/${tmdbId}`);
            if (!movie) return;

            currentMovie = movie;

            // Set Top Bar info
            document.getElementById('player-title').textContent = movie.title || movie.original_title;
            const year = (movie.release_date || '').split('-')[0] || '';
            const runtime = movie.runtime ? `${movie.runtime}m` : 'HD';
            document.getElementById('player-meta-badge').textContent = `${year} • ${runtime} • ★ ${(movie.vote_average || 0).toFixed(1)}`;

            // Set Overview & Info
            document.getElementById('p-info-title').textContent = `${movie.title} (${year})`;
            document.getElementById('p-info-overview').textContent = movie.overview || "No overview available for this movie.";

            // Load iframe server embed
            updatePlayerIframe(tmdbId, currentServer);

            // Load Similar Movies
            loadHorizontalList(`/movie/${tmdbId}/similar`, {}, 'player-similar-row');

            // Switch View
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-player').classList.add('active');
        }

        function updatePlayerIframe(tmdbId, serverKey) {
            const provider = SERVER_PROVIDERS[serverKey] || SERVER_PROVIDERS['primesrc'];
            const url = provider(tmdbId);
            const frame = document.getElementById('player-frame');
            frame.src = url;
        }

        function changeServer(serverKey) {
            currentServer = serverKey;
            if (currentMovie) {
                updatePlayerIframe(currentMovie.id, currentServer);
            }
        }

        function closePlayer() {
            const frame = document.getElementById('player-frame');
            frame.src = 'about:blank'; // Stop video stream
            document.getElementById('view-player').classList.remove('active');
            document.getElementById('view-home').classList.remove('hidden');
        }

        function goHome() {
            closePlayer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ═══════════════════════════════════════════════════════════
        //  INITIALIZE
        // ═══════════════════════════════════════════════════════════
        window.addEventListener('DOMContentLoaded', initHome);
    </script>
</body>

</html>
